<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>A Magical Birthday Surprise for Abirami 💖</title>
    <!-- Romantic & Elegant Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Romantic Stylesheet -->
    <style>
      .file-launcher-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        background: radial-gradient(circle at 10% 20%, #FFF5FA 0%, #FFF9F5 40%, #F5F0FF 80%, #FFEBF3 100%);
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #663B55;
        text-align: center;
      }
      .file-launcher-card {
        background: rgba(255, 255, 255, 0.94);
        border: 2px solid rgba(255, 111, 159, 0.35);
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(102, 59, 85, 0.12), 0 0 24px rgba(255, 111, 159, 0.2);
        padding: 2.5rem 2rem;
        max-width: 520px;
        width: 100%;
      }
      .file-launcher-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        background: linear-gradient(135deg, #FF6F9F 0%, #FF8FB5 50%, #FF6F9F 100%);
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: 600;
        padding: 0.95rem 2rem;
        border-radius: 9999px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 10px 25px rgba(255, 111, 159, 0.45);
        margin-top: 1.25rem;
        transition: transform 0.2s ease;
      }
      .file-launcher-btn:hover {
        transform: scale(1.04);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DPhKALGm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DFHrrbwM.css">
  </head>
  <body>
    <div id="root">
      <div class="file-launcher-wrap">
        <div class="file-launcher-card">
          <div style="font-size: 3.2rem; margin-bottom: 0.5rem;">💖</div>
          <h1 style="font-family: 'Playfair Display', Georgia, serif; font-size: 1.8rem; color: #663B55; margin-bottom: 0.75rem;">
            A Magical Birthday Surprise for Abirami
          </h1>
          <p id="launcher-status" style="font-size: 1rem; color: #8A5C77; line-height: 1.6; margin-bottom: 1rem;">
            Connecting to your surprise server...
          </p>
          <a id="launcher-btn" href="http://localhost:3000" class="file-launcher-btn">
            Open Surprise Website ✨
          </a>
          <div style="margin-top: 1.5rem; font-size: 0.85rem; color: #A07890; border-top: 1px solid rgba(255, 111, 159, 0.2); padding-top: 1rem;">
            💡 <em>Tip: Double-click <strong>start.bat</strong> in the <strong>bday</strong> folder to run anytime!</em>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        if (window.location.protocol === 'file:') {
          var statusEl = document.getElementById('launcher-status');

          function checkServer() {
            fetch('http://localhost:3000/', { mode: 'no-cors' })
              .then(function() {
                if (statusEl) statusEl.textContent = 'Server is running! Redirecting you now... 💖';
                setTimeout(function() {
                  window.location.href = 'http://localhost:3000/';
                }, 300);
              })
              .catch(function() {
                if (statusEl) {
                  statusEl.innerHTML = 'To open this surprise, please double-click <strong>start.bat</strong> inside the <strong>bday</strong> folder, then click below:';
                }
                setTimeout(checkServer, 1500);
              });
          }
          checkServer();
        }
      })();
    </script>
  </body>
</html>
